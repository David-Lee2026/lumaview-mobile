name: LumaView Android toolchain and fixed sources
on:
  push:
    branches: [implementation/android-20261003]
    paths: [.github/workflows/android-toolchain.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lvm-toolchain-provision
  cancel-in-progress: true
jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install official SDK and NDK
        run: python3 ci/install_sdk.py
      - name: Execute official cross-compiler and package local build inputs
        run: |
          set -euo pipefail
          mkdir -p evidence sources
          cp -r toolchain-evidence evidence/toolchain
          java -version 2>&1 | tee evidence/java-version.txt
          "$ANDROID_HOME/platform-tools/adb" version > evidence/adb-version.txt
          printf 'int lvm_probe(void) { return 23; }\n' > "$RUNNER_TEMP/probe.c"
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang" -shared -fPIC -Wl,-z,max-page-size=16384 "$RUNNER_TEMP/probe.c" -o evidence/libtoolchain_probe.so
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -hl evidence/libtoolchain_probe.so > evidence/arm64-link-probe.txt
          tar czf evidence/official-sdk-compile-inputs.tar.gz --exclude='*.ttf' --exclude='*.otf' -C "$ANDROID_HOME" platforms/android-36 build-tools/36.0.0 platform-tools
      - name: Acquire immutable source revisions
        shell: python
        run: |
          from pathlib import Path
          import urllib.request,json,subprocess,hashlib,tarfile
          repos={'mpv-android':('mpv-android/mpv-android','fdf74f6830c47dbaa8a22ac79726e8303f1db5af'),'mpv':('mpv-player/mpv','0b7ed670f7c353dd3dd4f8ae0fc788a181a15aa6'),'ffmpeg':('FFmpeg/FFmpeg','094a2f8a2a5e7fa64736e067de224ce28fdf5979')}
          manifest={}
          for name,(repo,sha) in repos.items():
              path=Path('sources')/name
              subprocess.run(['git','init',str(path)],check=True,stdout=subprocess.DEVNULL)
              subprocess.run(['git','-C',str(path),'remote','add','origin','https://github.com/'+repo+'.git'],check=True)
              subprocess.run(['git','-C',str(path),'fetch','--depth=1','origin',sha],check=True)
              subprocess.run(['git','-C',str(path),'checkout','--detach','FETCH_HEAD'],check=True)
              got=subprocess.check_output(['git','-C',str(path),'rev-parse','HEAD'],text=True).strip()
              assert got==sha,(got,sha)
              archive=Path('evidence')/(name+'-'+sha[:12]+'.tar.gz')
              with tarfile.open(archive,'w:gz') as t:
                  for f in sorted(path.rglob('*')):
                      if '.git' in f.relative_to(path).parts or not f.is_file():continue
                      if f.suffix.lower() in ('.ttf','.otf','.woff','.woff2','.ttc'):continue
                      t.add(f,arcname=name+'/'+str(f.relative_to(path)),recursive=False)
              manifest[name]={'repository':repo,'commit':sha,'archive':archive.name,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest()}
          Path('evidence/source-lock.json').write_text(json.dumps(manifest,indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-android-toolchain-and-sources
          path: |
            evidence
            toolchain-evidence
          retention-days: 30
