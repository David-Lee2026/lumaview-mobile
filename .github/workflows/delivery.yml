name: LumaView delivery verification
on:
  push:
    branches: [implementation/delivery-20261004]
    paths: [.github/workflows/delivery.yml, app/**, ci/prepare_release.py, ci/patch_engine.py, ci/crop_refresh_fix.py, ci/run_device_tests.py, ci/test_device_protocol.py, ci/test_crop_refresh_fix.py, ci/video_pair_fixtures.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lvm-delivery-final
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install official SDK and NDK
        run: python3 ci/install_sdk.py
      - name: Install native build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nasm ninja-build pkg-config ffmpeg glslang-tools python3-jinja2
          python3 -m venv /tmp/lvm-build-venv
          /tmp/lvm-build-venv/bin/pip install meson==1.11.0
          echo /tmp/lvm-build-venv/bin >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          run-id: 37127934301
          github-token: ${{ github.token }}
          path: native-input
      - name: Rebuild modified FFmpeg, mpv and JNI from retained fixed sources
        run: |
          python3 ci/prepare_release.py ${{ matrix.arch }}
          python3 ci/video_pair_fixtures.py
          python3 -m unittest ci.test_device_protocol ci.test_crop_refresh_fix -v 2>&1 | tee release-evidence/protocol-tests.log
          cp app/src/androidTest/assets/roi-fixtures.json release-evidence/roi-fixtures.json
      - name: Compile APK and unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDefaultDebugUnitTest :app:assembleDefaultDebug :app:assembleDefaultDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee release-evidence/gradle.log
          python3 ci/verify_apk.py ${{ matrix.arch }}
      - name: Prepare emulator
        if: matrix.arch == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cp -a "$ANDROID_HOME/bootstrap/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Installed Android player, pixels, exports and interrupted touch regressions
        if: matrix.arch == 'x86_64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1280x800
            adb shell wm density 160
            python3 ci/run_device_tests.py
      - name: Decode both Android exports and verify compressed payloads
        if: matrix.arch == 'x86_64'
        run: python3 ci/verify_exports.py release-evidence/device/integration app/src/androidTest/assets/baseline.mp4 > release-evidence/export-checks.json
      - name: Archive exact source
        if: always()
        run: |
          mkdir -p release-source
          git archive --format=tar.gz HEAD > release-source/LumaView-Mobile-source.tar.gz
          git rev-parse HEAD > release-source/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LumaView-delivery-${{ matrix.arch }}
          path: |
            release-out
            release-evidence
            release-source
            toolchain-evidence
            app/build/test-results
            app/build/outputs/androidTest-results
          retention-days: 30
