name: LumaView unit tests
on:
  push:
    branches: [implementation/android-20261003]
    paths: ['app/**', 'build.gradle', 'gradle/**', '.github/workflows/unit.yml']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew testDefaultDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-evidence
          path: |
            app/build/reports/tests
            app/build/test-results
