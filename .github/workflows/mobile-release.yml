name: LumaView Mobile APK and integration
on:
  push:
    branches: [implementation/android-20261003]
    paths: [.github/workflows/mobile-release.yml, app/**, shaders/**, ci/patch_engine.py, ci/prepare_release.py, ci/verify_apk.py, ci/release_fix.py, ci/verify_exports.py, ci/verify_shader.py, ci/run_device_tests.py, ci/native/**, ci/portrait_regression.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lumaview-mobile-release
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify restored readable source
        shell: python
        run: |
          from pathlib import Path
          import json
          assert Path('ci/mobile-payload-applied.json').is_file()
          assert Path('app/src/main/java/org/lumaview/mobile/ui/PlayerActivity.kt').is_file()
          assert Path('app/src/main/assets/lvm/mobile.glsl').read_bytes()==Path('shaders/lvm/mobile.glsl').read_bytes()
      - name: Record source identity
        id: commit
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p source-checkpoint
          git archive --format=tar.gz HEAD > source-checkpoint/LumaView-mobile-source.tar.gz
          git rev-parse HEAD > source-checkpoint/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LumaView-readable-source
          path: source-checkpoint
          retention-days: 30
  build:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            api: 35
          - arch: x86_64
            api: 29
          - arch: x86_64
            api: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install official SDK 36 and NDK r30
        run: python3 ci/install_sdk.py
      - name: Install native build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm ffmpeg glslang-tools python3-jinja2
          python3 -m venv /tmp/lvm-build-venv
          /tmp/lvm-build-venv/bin/pip install meson==1.11.0
          echo /tmp/lvm-build-venv/bin >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          run-id: 37127934301
          github-token: ${{ github.token }}
          path: native-input
      - name: Verify CPU compatibility processing
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined ci/native/test_lvm_cpu.c -lm -o /tmp/lvm-cpu-test
          /tmp/lvm-cpu-test
      - name: Check GLES 3 shader syntax
        run: python3 ci/verify_shader.py
      - name: Rebuild modified native engine and JNI bridge
        run: python3 ci/prepare_release.py ${{ matrix.arch }}
      - name: Compile application, test APK and unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDefaultDebugUnitTest :app:assembleDefaultDebug :app:assembleDefaultDebugAndroidTest :app:signingReport --stacktrace --no-daemon 2>&1 | tee release-evidence/gradle.log
      - name: Validate signed installable APK, ABI and 16K alignment
        run: python3 ci/verify_apk.py ${{ matrix.arch }}
      - uses: actions/download-artifact@v4
        if: matrix.arch == 'x86_64'
        with:
          name: LumaView-APK-x86_64-API29
          run-id: 37150812083
          github-token: ${{ github.token }}
          path: previous-apk
      - name: Prepare hardware accelerated emulator
        if: matrix.arch == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/bootstrap/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Native Android interaction, actual shader pixels and both exports
        if: matrix.arch == 'x86_64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1280x800
            adb shell wm density 160
            python3 ci/portrait_regression.py
            python3 ci/run_device_tests.py
      - name: Decode exported media and compare compressed payloads
        if: matrix.arch == 'x86_64'
        run: |
          mkdir -p release-evidence/decoded-integration
          tar -xf release-evidence/device-integration.tar -C release-evidence/decoded-integration
          python3 ci/verify_exports.py release-evidence/decoded-integration/integration app/src/androidTest/assets/baseline.mp4 > release-evidence/export-checks.json
      - uses: actions/upload-artifact@v4
        if: always() && matrix.arch == 'x86_64'
        with:
          name: LumaView-APK-x86_64-API${{ matrix.api }}
          path: release-out
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LumaView-Android-${{ matrix.arch }}${{ matrix.arch == 'x86_64' && format('-API{0}', matrix.api) || '' }}
          path: |
            ${{ matrix.arch == 'arm64' && 'release-out' || '' }}
            release-evidence
            toolchain-evidence
            app/build/reports/tests
            app/build/test-results
            app/build/outputs/androidTest-results
          retention-days: 30

  download:
    needs: [source, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: LumaView-Android-*
          path: validated
      - name: Publish complete validated test APK and evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          cp validated/LumaView-Android-arm64/release-out/*.apk publish/
          cp validated/LumaView-Android-arm64/release-out/SHA256SUMS.txt publish/
          (cd publish && sha256sum -c SHA256SUMS.txt)
          zip -qr publish/LumaView-Mobile-0.1.2-test-build-and-validation.zip validated
          cat > publish/BUILD_REPORT.txt <<EOF
          LumaView Mobile 0.1.2-test
          Source: $SOURCE_COMMIT
          ARM64: built and signature/ABI/alignment verified.
          API29/API35: x86_64 emulator, 9 instrumentation methods plus unit tests.
          Huawei/Mali-G76 physical verification: NOT_RUN.
          Huawei/Honor use independent CPU RGBA output by default, avoiding OpenGL.
          Compatibility preview longest edge: 960 pixels. Exports retain source size.
          Debug test certificate; install identity may differ from the previous APK.
          EOF
          gh release create v0.1.2-test publish/* --repo "$REPOSITORY" --target "$SOURCE_COMMIT" --prerelease --title 'LumaView Mobile 0.1.2-test' --notes-file publish/BUILD_REPORT.txt
