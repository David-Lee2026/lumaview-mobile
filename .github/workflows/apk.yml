name: LumaView installable APK
on:
  push:
    branches: [implementation/android-20261003]
    paths: ['app/**', 'ci/build_apk.py', 'ci/apply_native_patch.py', '.github/workflows/apk.yml', 'build.gradle', 'gradle/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lumaview-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked SDK and NDK
        run: python3 ci/install_sdk.py
      - uses: actions/download-artifact@v4
        with:
          name: native-arm64
          path: native-inputs/arm64
          run-id: 37127934301
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: native-x86_64
          path: native-inputs/x86_64
          run-id: 37127934301
          github-token: ${{ github.token }}
      - name: Build frontend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg ninja-build pkg-config
          python3 -m venv "$RUNNER_TEMP/lvm-meson"
          "$RUNNER_TEMP/lvm-meson/bin/pip" install meson==1.11.0
          echo "$RUNNER_TEMP/lvm-meson/bin" >> "$GITHUB_PATH"
      - name: Build patched engine, JNI and APK
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 ci/build_apk.py 2>&1 | tee evidence/build-apk.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LumaView-APKs-and-build-evidence
          path: |
            release
            evidence
            toolchain-evidence
            app/build/reports/tests
            app/build/test-results
            app/build/outputs/apk/androidTest
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: LumaView-ARM64-installable
          path: |
            release/LumaView_Mobile_0.1.0-test_arm64-v8a.apk
            release/SHA256SUMS.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: LumaView-build-evidence
          path: evidence
          retention-days: 30
  emulator:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: LumaView-APKs-and-build-evidence
          path: validation-inputs
      - name: Install media verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg ripgrep
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrument actual x86_64 APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/verify_emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LumaView-emulator-validation-NOT-Huawei
          path: emulator-evidence
          retention-days: 30
          if-no-files-found: warn
